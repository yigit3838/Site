<!DOCTYPE html>
<html>
<head>
  <title>Advanced Rating Football</title>
  <style>
    body{margin:0;background:#0a7a2f;overflow:hidden;font-family:Arial;}
    canvas{display:block;margin:auto;background:#0a7a2f;}
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// PLAYER (ratingli artık net fark var)
let player = {
  x:200, y:500, r:12,
  pace: 5.2,
  shoot: 1.4,
  control: 0.15
};

// AI
let ai = {
  x:200, y:150, r:12,
  pace: 2.4
};

// BALL
let ball = { x:220, y:400, r:8, vx:0, vy:0 };

let goal = { x:150, y:10, w:100, h:20 };

let score = 0;
let input = { x:0, y:0 };

// controls
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") input.x=1;
  if(e.key==="ArrowLeft") input.x=-1;
  if(e.key==="ArrowUp") input.y=-1;
  if(e.key==="ArrowDown") input.y=1;
});

document.addEventListener("keyup",()=>{
  input.x=0;
  input.y=0;
});

function dist(a,b){
  let dx = a.x - b.x;
  let dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy);
}

function update(){

  // PLAYER MOVE (pace etkili)
  player.x += input.x * player.pace;
  player.y += input.y * player.pace;

  // AI chase
  let dx = ball.x - ai.x;
  let dy = ball.y - ai.y;
  let d = Math.sqrt(dx*dx + dy*dy);

  ai.x += (dx/d) * ai.pace;
  ai.y += (dy/d) * ai.pace;

  // BALL
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.97;
  ball.vy *= 0.97;

  // PLAYER CONTROL (çok fark ettiriyor artık)
  let pd = dist(ball, player);
  if(pd < 22){
    ball.vx += (ball.x - player.x) * player.control;
    ball.vy += (ball.y - player.y) * player.control;
  }

  // AI TOUCH
  let ad = dist(ball, ai);
  if(ad < 20){
    ball.vx += (ball.x - ai.x) * 0.06;
    ball.vy += (ball.y - ai.y) * 0.06;
  }

  // GOAL
  if(ball.y < goal.y + goal.h &&
     ball.x > goal.x &&
     ball.x < goal.x + goal.w){
    score++;
    reset();
  }

  draw();
  requestAnimationFrame(update);
}

function reset(){
  player.x = 200;
  player.y = 500;

  ai.x = 200;
  ai.y = 150;

  ball.x = 220;
  ball.y = 400;

  ball.vx = 0;
  ball.vy = 0;
}

function draw(){

  ctx.clearRect(0,0,400,600);

  // field
  ctx.strokeStyle="white";
  ctx.strokeRect(10,10,380,580);

  // goal
  ctx.fillStyle="white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  // player
  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();

  // AI
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(ai.x,ai.y,ai.r,0,Math.PI*2);
  ctx.fill();

  // ball
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  // UI
  ctx.fillStyle="white";
  ctx.fillText("Score: " + score,10,590);
  ctx.fillText("Pace: " + player.pace.toFixed(1),120,590);
  ctx.fillText("Control: " + player.control.toFixed(2),220,590);
}

update();
</script>

</body>
</html>
