<!DOCTYPE html>
<html>
<head>
  <title>Team Match</title>
  <style>
    body{margin:0;background:#0a7a2f;overflow:hidden;font-family:Arial;}
    canvas{display:block;margin:auto;background:#0a7a2f;}
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let input = {x:0,y:0};

// TEAM A (senin takım)
let player = {x:200,y:500,r:10,speed:4};
let ally1  = {x:160,y:520,r:10,speed:3};
let ally2  = {x:240,y:520,r:10,speed:3};

// TEAM B (rakip)
let enemy1 = {x:150,y:150,r:10,speed:2.5};
let enemy2 = {x:250,y:150,r:10,speed:2.5};

// BALL
let ball = {x:200,y:300,r:7,vx:0,vy:0};

let goal = {x:150,y:10,w:100,h:20};
let score = 0;

// CONTROLS
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") input.x=1;
  if(e.key==="ArrowLeft") input.x=-1;
  if(e.key==="ArrowUp") input.y=-1;
  if(e.key==="ArrowDown") input.y=1;
});

document.addEventListener("keyup",()=>{
  input.x=0; input.y=0;
});

function dist(a,b){
  return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
}

function moveTowards(obj,target,speed){
  let dx = target.x - obj.x;
  let dy = target.y - obj.y;
  let d = Math.sqrt(dx*dx+dy*dy);
  if(d>0){
    obj.x += (dx/d)*speed;
    obj.y += (dy/d)*speed;
  }
}

function update(){

  // PLAYER CONTROL
  player.x += input.x * player.speed;
  player.y += input.y * player.speed;

  // ALLY AI (topa gider)
  moveTowards(ally1, ball, ally1.speed);
  moveTowards(ally2, ball, ally2.speed);

  // ENEMY AI
  moveTowards(enemy1, ball, enemy1.speed);
  moveTowards(enemy2, ball, enemy2.speed);

  // BALL PHYSICS
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.97;
  ball.vy *= 0.97;

  // PLAYER TOUCH
  [player, ally1, ally2, enemy1, enemy2].forEach(p=>{
    if(dist(ball,p)<15){
      ball.vx += (ball.x - p.x)*0.08;
      ball.vy += (ball.y - p.y)*0.08;
    }
  });

  // GOAL
  if(ball.y < goal.y + goal.h &&
     ball.x > goal.x &&
     ball.x < goal.x + goal.w){
    score++;
    reset();
  }

  draw();
  requestAnimationFrame(update);
}

function reset(){
  player.x=200; player.y=500;
  ally1.x=160; ally1.y=520;
  ally2.x=240; ally2.y=520;

  enemy1.x=150; enemy1.y=150;
  enemy2.x=250; enemy2.y=150;

  ball.x=200; ball.y=300;
  ball.vx=0; ball.vy=0;
}

function draw(){

  ctx.clearRect(0,0,400,600);

  ctx.strokeStyle="white";
  ctx.strokeRect(10,10,380,580);

  ctx.fillStyle="white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  // TEAM A
  ctx.fillStyle="blue";
  [player,ally1,ally2].forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });

  // TEAM B
  ctx.fillStyle="red";
  [enemy1,enemy2].forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });

  // BALL
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  // SCORE
  ctx.fillStyle="white";
  ctx.fillText("Score: "+score,10,590);
}

update();
</script>

</body>
</html>
