<!DOCTYPE html>
<html>
<head>
  <title>Mini Football Game</title>
  <style>
    body { margin:0; background:#0a7a2f; }
    canvas { display:block; margin:auto; background:#0a7a2f; }
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// BALL
let ball = {
  x: 200,
  y: 500,
  vx: 0,
  vy: 0,
  r: 10
};

let score = 0;

// GOAL
let goal = { x: 150, y: 10, w: 100, h: 20 };

// FRICTION
let friction = 0.98;

// INPUT
document.addEventListener("keydown", (e) => {

  // hareket
  if(e.key === "ArrowRight") ball.vx += 2;
  if(e.key === "ArrowLeft") ball.vx -= 2;
  if(e.key === "ArrowUp") ball.vy -= 2;
  if(e.key === "ArrowDown") ball.vy += 2;

  // şut (space = güçlü vur)
  if(e.key === " ") {
    ball.vy = -8;
  }
});

function update(){

  // physics
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= friction;
  ball.vy *= friction;

  // boundaries
  if(ball.x < 0 || ball.x > 400) ball.vx *= -1;
  if(ball.y < 0 || ball.y > 600) ball.vy *= -1;

  // GOAL
  if(
    ball.y < goal.y + goal.h &&
    ball.x > goal.x &&
    ball.x < goal.x + goal.w
  ){
    score++;
    resetBall();
  }

  draw();
  requestAnimationFrame(update);
}

function resetBall(){
  ball.x = 200;
  ball.y = 500;
  ball.vx = 0;
  ball.vy = 0;
}

function draw(){

  ctx.clearRect(0,0,400,600);

  // saha
  ctx.strokeStyle = "white";
  ctx.strokeRect(10,10,380,580);

  // kale
  ctx.fillStyle = "white";
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

  // top
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = "white";
  ctx.fill();

  // skor
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 590);
}

update();
</script>

</body>
</html>
