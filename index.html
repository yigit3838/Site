<!DOCTYPE html>
<html>
<head>
  <title>Benim Sitem</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    .box {
      margin-top: 120px;
    }

    h1 {
      font-size: 42px;
    }

    button {
      padding: 15px 25px;
      border: none;
      background: #00c2ff;
      color: black;
      font-size: 18px;
      cursor: pointer;
      border-radius: 10px;
      margin-top: 20px;
    }

    button:hover {
      background: #00ff88;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Hoş Geldin</h1>
    <p>Bu artık daha iyi bir site</p>
    <button onclick="alert('Tıkladın!')">Tıkla</button>
  </div>
</body>
</html>
