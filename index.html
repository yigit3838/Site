<!DOCTYPE html>
<html>
<head>
  <title>Football Game</title>
  <style>
    body { margin:0; background:#0a7a2f; }
    canvas { display:block; margin:auto; background:#0a7a2f; }
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// PLAYER
let player = { x:200, y:500, r:12, speed:4 };

// BALL
let ball = { x:220, y:500, r:8, vx:0, vy:0 };

// GOAL
let goal = { x:150, y:10, w:100, h:20 };

let score = 0;

let keys = {};

document.addEventListener("keydown",(e)=>keys[e.key]=true);
document.addEventListener("keyup",(e)=>keys[e.key]=false);

function update(){

  // PLAYER MOVE
  if(keys["ArrowRight"]) player.x += player.speed;
  if(keys["ArrowLeft"]) player.x -= player.speed;
  if(keys["ArrowUp"]) player.y -= player.speed;
  if(keys["ArrowDown"]) player.y += player.speed;

  // BALL FOLLOW (topa dokunma hissi)
  let dx = ball.x - player.x;
  let dy = ball.y - player.y;
  let dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < 20){
    ball.vx += dx * 0.1;
    ball.vy += dy * 0.1;
  }

  // BALL PHYSICS
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.97;
  ball.vy *= 0.97;

  // GOAL
  if(ball.y < goal.y + goal.h &&
     ball.x > goal.x &&
     ball.x < goal.x + goal.w){
    score++;
    reset();
  }

  draw();
  requestAnimationFrame(update);
}

function reset(){
  player.x = 200;
  player.y = 500;
  ball.x = 220;
  ball.y = 500;
  ball.vx = 0;
  ball.vy = 0;
}

function draw(){

  ctx.clearRect(0,0,400,600);

  // saha
  ctx.strokeStyle="white";
  ctx.strokeRect(10,10,380,580);

  // kale
  ctx.fillStyle="white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  // player
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle="blue";
  ctx.fill();

  // ball
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fillStyle="white";
  ctx.fill();

  // score
  ctx.fillStyle="white";
  ctx.font="20px Arial";
  ctx.fillText("Score: "+score,10,590);
}

update();
</script>

</body>
</html>
