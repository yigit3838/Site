<!DOCTYPE html>
<html>
<head>
  <title>Smart AI Football</title>
  <style>
    body { margin:0; background:#0a7a2f; overflow:hidden; }
    canvas { display:block; margin:auto; background:#0a7a2f; }
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// PLAYER
let player = { x:200, y:500, r:12 };

// AI (smart)
let ai = { x:200, y:120, r:12, speed:2.2 };

// BALL
let ball = { x:220, y:500, r:8, vx:0, vy:0 };

let goal = { x:150, y:10, w:100, h:20 };
let score = 0;

let input = { x:0, y:0 };

// controls
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") input.x=1;
  if(e.key==="ArrowLeft") input.x=-1;
  if(e.key==="ArrowUp") input.y=-1;
  if(e.key==="ArrowDown") input.y=1;
});

document.addEventListener("keyup",()=>{
  input.x=0;
  input.y=0;
});

// distance helper
function dist(a,b){
  let dx = a.x - b.x;
  let dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy);
}

function update(){

  // PLAYER MOVE
  player.x += input.x * 4;
  player.y += input.y * 4;

  // SMART AI LOGIC
  let targetX, targetY;

  // Eğer top yukarıdaysa (atak yap)
  if(ball.y < 300){
    targetX = ball.x;
    targetY = ball.y;
  }
  // yoksa kendi yarı sahasını koru
  else {
    targetX = 200;
    targetY = 120;
  }

  let dx = targetX - ai.x;
  let dy = targetY - ai.y;
  let d = Math.sqrt(dx*dx + dy*dy);

  ai.x += (dx/d) * ai.speed;
  ai.y += (dy/d) * ai.speed;

  // BALL PHYSICS
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.97;
  ball.vy *= 0.97;

  // PLAYER TOUCH
  let pdx = ball.x - player.x;
  let pdy = ball.y - player.y;
  let pd = Math.sqrt(pdx*pdx + pdy*pdy);

  if(pd < 20){
    ball.vx += pdx * 0.1;
    ball.vy += pdy * 0.1;
  }

  // AI TOUCH (savunma + müdahale)
  let adx = ball.x - ai.x;
  let ady = ball.y - ai.y;
  let ad = Math.sqrt(adx*adx + ady*ady);

  if(ad < 20){
    ball.vx += adx * 0.08;
    ball.vy += ady * 0.08;
  }

  // GOAL
  if(ball.y < goal.y + goal.h &&
     ball.x > goal.x &&
     ball.x < goal.x + goal.w){
    score++;
    reset();
  }

  draw();
  requestAnimationFrame(update);
}

function reset(){
  player.x = 200;
  player.y = 500;

  ai.x = 200;
  ai.y = 120;

  ball.x = 220;
  ball.y = 400;

  ball.vx = 0;
  ball.vy = 0;
}

function draw(){

  ctx.clearRect(0,0,400,600);

  // field
  ctx.strokeStyle="white";
  ctx.strokeRect(10,10,380,580);

  // goal
  ctx.fillStyle="white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  // AI
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(ai.x,ai.y,ai.r,0,Math.PI*2);
  ctx.fill();

  // PLAYER
  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();

  // BALL
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  // SCORE
  ctx.fillStyle="white";
  ctx.font="16px Arial";
  ctx.fillText("Score: "+score,10,590);
}

update();
</script>

</body>
</html>
