<!DOCTYPE html>
<html>
<head>
  <title>Football - Solid Base</title>
  <style>
    body { margin:0; background:#0a7a2f; overflow:hidden; }
    canvas { display:block; margin:auto; background:#0a7a2f; }
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// PLAYER
let player = { x:200, y:500, r:12 };

// AI defender
let ai = { x:200, y:150, r:12, speed:2.2 };

// GOALKEEPER (SMART)
let keeper = { x:200, y:30, speed:1.5 };

// BALL
let ball = { x:220, y:500, r:8, vx:0, vy:0 };

// GOAL
let goal = { x:150, y:10, w:100, h:20 };

let score = 0;
let difficulty = 1;

let input = { x:0, y:0 };

// controls
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") input.x=1;
  if(e.key==="ArrowLeft") input.x=-1;
  if(e.key==="ArrowUp") input.y=-1;
  if(e.key==="ArrowDown") input.y=1;
});

document.addEventListener("keyup",()=>{
  input.x=0;
  input.y=0;
});

function dist(a,b){
  let dx = a.x - b.x;
  let dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy);
}

function update(){

  // PLAYER
  player.x += input.x * 4;
  player.y += input.y * 4;

  // AI DEFENDER (temel pozisyon)
  let dx = ball.x - ai.x;
  let dy = ball.y - ai.y;
  let d = Math.sqrt(dx*dx + dy*dy);

  ai.x += (dx/d) * ai.speed;
  ai.y += (dy/d) * ai.speed;

  // KEEPER AI (asıl upgrade)
  let targetX = ball.x;

  // sadece top kaleye yaklaşıyorsa aktif olur
  if(ball.y < 250){
    let diffSpeed = keeper.speed + difficulty * 0.5;

    if(Math.abs(keeper.x - targetX) > 5){
      keeper.x += (targetX - keeper.x) * 0.05 * diffSpeed;
    }
  }

  // BALL
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.97;
  ball.vy *= 0.97;

  // PLAYER TOUCH
  let pd = dist(ball, player);
  if(pd < 20){
    ball.vx += (ball.x - player.x) * 0.1;
    ball.vy += (ball.y - player.y) * 0.1;
  }

  // AI TOUCH
  let ad = dist(ball, ai);
  if(ad < 20){
    ball.vx += (ball.x - ai.x) * 0.06;
    ball.vy += (ball.y - ai.y) * 0.06;
  }

  // KEEPER BLOCK
  if(
    ball.y < 40 &&
    ball.x > keeper.x - 40 &&
    ball.x < keeper.x + 40
  ){
    ball.vy *= -0.6;
    ball.y += 10;
  }

  // GOAL
  if(ball.y < goal.y + goal.h &&
     ball.x > goal.x &&
     ball.x < goal.x + goal.w){
    score++;
    reset();
  }

  draw();
  requestAnimationFrame(update);
}

function reset(){
  player.x = 200;
  player.y = 500;

  ai.x = 200;
  ai.y = 150;

  keeper.x = 200;

  ball.x = 220;
  ball.y = 400;
  ball.vx = 0;
  ball.vy = 0;
}

function draw(){

  ctx.clearRect(0,0,400,600);

  // field
  ctx.strokeStyle="white";
  ctx.strokeRect(10,10,380,580);

  // goal
  ctx.fillStyle="white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  // keeper
  ctx.fillStyle="yellow";
  ctx.fillRect(keeper.x-40, 20, 80, 10);

  // AI
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(ai.x,ai.y,ai.r,0,Math.PI*2);
  ctx.fill();

  // PLAYER
  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();

  // BALL
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="16px Arial";
  ctx.fillText("Score: "+score,10,590);
}

update();
</script>

</body>
</html>
