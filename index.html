<!DOCTYPE html>
<html>
<head>
  <title>Football Player System</title>
  <style>
    body{margin:0;background:#0a7a2f;overflow:hidden;font-family:Arial;}
    canvas{display:block;margin:auto;background:#0a7a2f;}
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let input = {x:0,y:0};

// 🧍 PLAYER (özel karakter)
let player = {
  x:200, y:500, r:10,
  name: "Player",
  pace: 5.5,
  shoot: 1.6,
  control: 0.18
};

// 🤖 AI PLAYER
let ai = {
  x:200, y:150, r:10,
  pace: 3.0,
  control: 0.08
};

// ⚽ BALL
let ball = {x:200,y:300,r:7,vx:0,vy:0};

let goal = {x:150,y:10,w:100,h:20};
let score = 0;

// CONTROLS
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") input.x=1;
  if(e.key==="ArrowLeft") input.x=-1;
  if(e.key==="ArrowUp") input.y=-1;
  if(e.key==="ArrowDown") input.y=1;
});

document.addEventListener("keyup",()=>{
  input.x=0; input.y=0;
});

function dist(a,b){
  return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
}

function update(){

  // 🧍 PLAYER MOVE (pace farkı)
  player.x += input.x * player.pace;
  player.y += input.y * player.pace;

  // 🤖 AI MOVE (topa gider)
  let dx = ball.x - ai.x;
  let dy = ball.y - ai.y;
  let d = Math.sqrt(dx*dx+dy*dy);

  ai.x += (dx/d) * ai.pace;
  ai.y += (dy/d) * ai.pace;

  // ⚽ BALL
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.96;
  ball.vy *= 0.96;

  // 🧠 PLAYER TOUCH (control farkı burada)
  if(dist(ball,player)<18){
    ball.vx += (ball.x - player.x) * player.control;
    ball.vy += (ball.y - player.y) * player.control;
  }

  // 🤖 AI TOUCH
  if(dist(ball,ai)<18){
    ball.vx += (ball.x - ai.x) * ai.control;
    ball.vy += (ball.y - ai.y) * ai.control;
  }

  // ⚽ GOAL
  if(ball.y < goal.y + goal.h &&
     ball.x > goal.x &&
     ball.x < goal.x + goal.w){
    score++;
    reset();
  }

  draw();
  requestAnimationFrame(update);
}

function reset(){
  player.x=200; player.y=500;
  ai.x=200; ai.y=150;
  ball.x=200; ball.y=300;
  ball.vx=0; ball.vy=0;
}

function draw(){

  ctx.clearRect(0,0,400,600);

  ctx.strokeStyle="white";
  ctx.strokeRect(10,10,380,580);

  ctx.fillStyle="white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  // PLAYER
  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();

  // AI
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(ai.x,ai.y,ai.r,0,Math.PI*2);
  ctx.fill();

  // BALL
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  // UI
  ctx.fillStyle="white";
  ctx.fillText("Score: "+score,10,590);
  ctx.fillText("Pace: "+player.pace.toFixed(1),120,590);
  ctx.fillText("Control: "+player.control.toFixed(2),220,590);
}

update();
</script>

</body>
</html>
