<!DOCTYPE html>
<html>
<head>
  <title>Mobile Football</title>
  <style>
    body { margin:0; background:#0a7a2f; overflow:hidden; }

    canvas { display:block; margin:auto; background:#0a7a2f; }

    #shootBtn{
      position:absolute;
      bottom:40px;
      right:40px;
      width:90px;
      height:90px;
      border-radius:50%;
      background:red;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      user-select:none;
    }

    #joystick{
      position:absolute;
      bottom:40px;
      left:40px;
      width:120px;
      height:120px;
      background:rgba(255,255,255,0.2);
      border-radius:50%;
    }

    #stick{
      position:absolute;
      width:50px;
      height:50px;
      background:white;
      border-radius:50%;
      top:35px;
      left:35px;
    }
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<div id="joystick"><div id="stick"></div></div>
<div id="shootBtn">SHOOT</div>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let player = { x:200, y:500, r:12 };
let ball = { x:220, y:500, r:8, vx:0, vy:0 };

let goal = { x:150, y:10, w:100, h:20 };

let score = 0;

// joystick
let joystick = document.getElementById("joystick");
let stick = document.getElementById("stick");

let center = { x:60, y:60 };
let input = { x:0, y:0 };

// touch joystick
joystick.addEventListener("touchstart", ()=>{});
joystick.addEventListener("touchend", ()=>{
  input.x = 0;
  input.y = 0;
  stick.style.left="35px";
  stick.style.top="35px";
});

joystick.addEventListener("touchmove", (e)=>{
  let t = e.touches[0];
  let rect = joystick.getBoundingClientRect();

  let dx = t.clientX - rect.left - center.x;
  let dy = t.clientY - rect.top - center.y;

  let dist = Math.sqrt(dx*dx + dy*dy);
  let max = 40;

  if(dist > max){
    dx = dx/dist * max;
    dy = dy/dist * max;
  }

  input.x = dx/max;
  input.y = dy/max;

  stick.style.left = (center.x + dx - 25) + "px";
  stick.style.top = (center.y + dy - 25) + "px";
});

// SHOOT BUTTON
document.getElementById("shootBtn").addEventListener("touchstart", ()=>{
  let dx = ball.x - player.x;
  let dy = ball.y - player.y;

  let dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < 30){
    ball.vx += dx * 0.3;
    ball.vy += dy * 0.3;
  }
});

function update(){

  // player move
  player.x += input.x * 4;
  player.y += input.y * 4;

  // ball follow
  let dx = ball.x - player.x;
  let dy = ball.y - player.y;
  let dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < 20){
    ball.vx += dx * 0.1;
    ball.vy += dy * 0.1;
  }

  // physics
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.97;
  ball.vy *= 0.97;

  // goal
  if(ball.y < goal.y + goal.h &&
     ball.x > goal.x &&
     ball.x < goal.x + goal.w){
    score++;
    reset();
  }

  draw();
  requestAnimationFrame(update);
}

function reset(){
  player.x = 200;
  player.y = 500;
  ball.x = 220;
  ball.y = 500;
  ball.vx = 0;
  ball.vy = 0;
}

function draw(){
  ctx.clearRect(0,0,400,600);

  ctx.strokeStyle="white";
  ctx.strokeRect(10,10,380,580);

  ctx.fillStyle="white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="20px Arial";
  ctx.fillText("Score: "+score,10,590);
}

update();
</script>

</body>
</html>
