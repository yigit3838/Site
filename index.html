<!DOCTYPE html>
<html>
<head>
  <title>Team Select Football</title>
  <style>
    body{
      margin:0;
      background:#0a7a2f;
      font-family:Arial;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }

    #menu{
      text-align:center;
    }

    button{
      width:220px;
      padding:10px;
      margin:5px;
      font-size:16px;
      border:none;
      border-radius:8px;
    }

    canvas{
      display:none;
      margin:auto;
      background:#0a7a2f;
    }
  </style>
</head>
<body>

<div id="menu">
  <h2>Takım Seç</h2>

  <button onclick="startGame('GS')">Galatasaray</button>
  <button onclick="startGame('FB')">Fenerbahçe</button>
  <button onclick="startGame('BJK')">Beşiktaş</button>
  <button onclick="startGame('TS')">Trabzonspor</button>
  <button onclick="startGame('MANCITY')">Manchester City</button>
  <button onclick="startGame('REAL')">Real Madrid</button>
</div>

<canvas id="game" width="400" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let playerTeam = "";
let score = 0;

let player = { x:200, y:500, r:12, pace:4 };
let ai = { x:200, y:150, r:12, pace:2.2 };
let ball = { x:220, y:400, r:8, vx:0, vy:0 };
let goal = { x:150, y:10, w:100, h:20 };

let input = { x:0, y:0 };

function startGame(team){
  playerTeam = team;

  document.getElementById("menu").style.display = "none";
  c.style.display = "block";

  reset();
  update();
}

// controls
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") input.x=1;
  if(e.key==="ArrowLeft") input.x=-1;
  if(e.key==="ArrowUp") input.y=-1;
  if(e.key==="ArrowDown") input.y=1;
});

document.addEventListener("keyup",()=>{
  input.x=0;
  input.y=0;
});

function dist(a,b){
  return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
}

function update(){

  // PLAYER MOVE
  player.x += input.x * player.pace;
  player.y += input.y * player.pace;

  // AI
  let dx = ball.x - ai.x;
  let dy = ball.y - ai.y;
  let d = Math.sqrt(dx*dx + dy*dy);

  ai.x += (dx/d) * ai.pace;
  ai.y += (dy/d) * ai.pace;

  // BALL
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.97;
  ball.vy *= 0.97;

  // PLAYER TOUCH
  let pd = dist(ball, player);
  if(pd < 20){
    ball.vx += (ball.x - player.x) * 0.1;
    ball.vy += (ball.y - player.y) * 0.1;
  }

  // AI TOUCH
  let ad = dist(ball, ai);
  if(ad < 20){
    ball.vx += (ball.x - ai.x) * 0.06;
    ball.vy += (ball.y - ai.y) * 0.06;
  }

  // GOAL
  if(ball.y < goal.y + goal.h &&
     ball.x > goal.x &&
     ball.x < goal.x + goal.w){
    score++;
    reset();
  }

  draw();
  requestAnimationFrame(update);
}

function reset(){
  player.x = 200;
  player.y = 500;

  ai.x = 200;
  ai.y = 150;

  ball.x = 220;
  ball.y = 400;

  ball.vx = 0;
  ball.vy = 0;
}

function draw(){
  ctx.clearRect(0,0,400,600);

  ctx.strokeStyle="white";
  ctx.strokeRect(10,10,380,580);

  ctx.fillStyle="white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(ai.x,ai.y,ai.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.fillText("Team: " + playerTeam,10,590);
  ctx.fillText("Score: " + score,120,590);
}

</script>

</body>
</html>
