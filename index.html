<!DOCTYPE html>
<html>
<head>
  <title>Football Ratings</title>
  <style>
    body { margin:0; background:#0a7a2f; overflow:hidden; }
    canvas { display:block; margin:auto; background:#0a7a2f; }
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// PLAYER (ratingli)
let player = {
  x:200, y:500, r:12,
  pace: 4.5,
  shoot: 1.2,
  control: 0.12
};

// AI
let ai = {
  x:200, y:150, r:12,
  pace: 2.3
};

// BALL
let ball = { x:220, y:500, r:8, vx:0, vy:0 };

let goal = { x:150, y:10, w:100, h:20 };

let score = 0;
let input = { x:0, y:0 };

// controls
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") input.x=1;
  if(e.key==="ArrowLeft") input.x=-1;
  if(e.key==="ArrowUp") input.y=-1;
  if(e.key==="ArrowDown") input.y=1;
});

document.addEventListener("keyup",()=>{
  input.x=0;
  input.y=0;
});

function dist(a,b){
  let dx = a.x - b.x;
  let dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy);
}

function update(){

  // PLAYER MOVE (pace etkili)
  player.x += input.x * player.pace;
  player.y += input.y * player.pace;

  // AI chase
  let dx = ball.x - ai.x;
  let dy = ball.y - ai.y;
  let d = Math.sqrt(dx*dx + dy*dy);

  ai.x += (dx/d) * ai.pace;
  ai.y += (dy/d) * ai.pace;

  // BALL PHYSICS
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= 0.97;
  ball.vy *= 0.97;

  // PLAYER CONTROL (rating etkisi)
  let pdx = ball.x - player.x;
  let pdy = ball.y - player.y;
  let pd = Math.sqrt(pdx*pdx + pdy*pdy);

  if(pd < 20){
    ball.vx += pdx * player.control;
    ball.vy += pdy * player.control;
  }

  // AI TOUCH
  let adx = ball.x - ai.x;
  let ady = ball.y - ai.y;
  let ad = Math.sqrt(adx*adx + ady*ady);

  if(ad < 20){
    ball.vx += adx * 0.06;
    ball.vy += ady * 0.06;
  }

  // GOAL
  if(ball.y < goal.y + goal.h &&
     ball.x > goal.x &&
     ball.x < goal.x + goal.w){
    score++;
    reset();
  }

  draw();
  requestAnimationFrame(update);
}

function reset(){
  player.x = 200;
  player.y = 500;

  ai.x = 200;
  ai.y = 150;

  ball.x = 220;
  ball.y = 400;

  ball.vx = 0;
  ball.vy = 0;
}

function draw(){

  ctx.clearRect(0,0,400,600);

  ctx.strokeStyle="white";
  ctx.strokeRect(10,10,380,580);

  ctx.fillStyle="white";
  ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

  // AI
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(ai.x,ai.y,ai.r,0,Math.PI*2);
  ctx.fill();

  // PLAYER
  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();

  // BALL
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  // UI
  ctx.fillStyle="white";
  ctx.font="16px Arial";
  ctx.fillText("Score: "+score,10,590);

  ctx.fillText("Pace: "+player.pace,250,590);
}

update();
</script>

</body>
</html>
